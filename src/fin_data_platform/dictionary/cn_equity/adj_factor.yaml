dataset: cn_equity.adj_factor
semantic_version: 1
domain: cn_equity
description: 复权因子（累计后复权口径；事件步进，按知识时间版本化）
pit_class: market
business_key: [entity_id, trade_date]
physical_key: [entity_id, trade_date, knowledge_time, version]
grain: 标的 × 交易日
update_sla:
  frequency: daily
  earliest_available: "T+0 18:00"
  latest_available: "T+0 22:00"
  tolerance: "2h"
sources:
  - provider: tushare
    endpoint: adj_factor
  - provider: baostock
    endpoint: query_adjust_factor
coverage:
  universe: A 股（含退市）
  universe_source: cn_equity.listing_lifecycle
  history_start: "1990-12-19"
  expected_dates:
    calendar: ref.trade_calendar
    frequency: daily
storage:
  canonical_table: cn_equity.adj_factor
  read_model: mart.equity_adj_factor_v1
  read_model_impl: view
  partition_strategy: event_time
  partition_interval: 1 month
  retention: all
  compression:
    after: 7 days
    segment_by: entity_id
    order_by: trade_date, knowledge_time, version
quality:
  - rule: unique
    keys: [entity_id, trade_date, knowledge_time, version]
    severity: error
  - rule: range
    field: adj_factor
    min: 0
    severity: error
  - rule: reconcile
    against: ref.entity
    severity: warn
lineage:
  upstream: []
  transform: raw
mappings:
  - provider: tushare
    endpoint: adj_factor
    fields:
      adj_factor: adj_factor
  - provider: baostock
    endpoint: query_adjust_factor
    fields:
      adj_factor: backAdjustFactor
fields:
  - name: entity_id
    type: int64
    nullable: false
    description: 平台标的 ID
    pit_role: none
  - name: trade_date
    type: date
    nullable: false
    description: 交易日（事件步进生效日）
    pit_role: event_time
  - name: adj_factor
    type: decimal
    precision: 20
    scale: 6
    nullable: false
    description: 累计后复权因子（归一化后跨源一致；锚点由来源定义）
    pit_role: none
  - name: knowledge_time
    type: timestamp_tz
    nullable: false
    description: 该版本进入平台的时间
    pit_role: knowledge_time
  - name: ingest_time
    type: timestamp_tz
    nullable: false
    description: 物理入库时间（审计）
    pit_role: ingest_time
  - name: version
    type: int64
    nullable: false
    description: 同业务键版本号
    pit_role: none
  - name: provider
    type: enum
    enum: [tushare, baostock]
    nullable: false
    description: 因子来源
    pit_role: none
