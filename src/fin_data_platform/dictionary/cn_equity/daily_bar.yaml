dataset: cn_equity.daily_bar
semantic_version: 1
domain: cn_equity
description: A 股日线行情（不复权原始价；复权价按 raw + factor、as-of 计算）
pit_class: market
business_key: [entity_id, trade_date]
physical_key: [entity_id, trade_date, knowledge_time, version]
grain: 标的 × 交易日
update_sla:
  frequency: daily
  earliest_available: "T+0 18:00"
  latest_available: "T+0 22:00"
  tolerance: "2h"
sources:
  - provider: tushare
    endpoint: daily
  - provider: baostock
    endpoint: query_history_k_data_plus
coverage:
  universe: A 股（含退市）
  universe_source: ref.entity
  history_start: "1990-12-19"
  expected_dates:
    calendar: ref.trade_calendar
    frequency: daily
storage:
  canonical_table: cn_equity.daily_bar
  read_model: mart.equity_daily_bar_v1
  read_model_impl: view
  partition_strategy: event_time
  partition_interval: 1 month
  retention: all
  compression:
    after: 7 days
    segment_by: entity_id
    order_by: trade_date, knowledge_time, version
quality:
  - rule: unique
    keys: [entity_id, trade_date, knowledge_time, version]
    severity: error
  - rule: not_null
    fields: [entity_id, trade_date, knowledge_time, version]
    severity: error
  - rule: range
    field: volume
    min: 0
    severity: error
  - rule: expression
    expr: "high >= low and low <= close and close <= high"
    severity: error
  - rule: reconcile
    against: raw.tushare_daily
    severity: warn
  - rule: reconcile
    against: ref.entity
    severity: warn
lineage:
  upstream: []
  transform: raw
mappings:
  - provider: tushare
    endpoint: daily
    fields:
      open: open
      high: high
      low: low
      close: close
      volume: vol
      amount: amount
  - provider: baostock
    endpoint: query_history_k_data_plus
    fields:
      open: open
      high: high
      low: low
      close: close
      volume: volume
      amount: amount
fields:
  - name: entity_id
    type: int64
    nullable: false
    description: 平台实体 ID（实体注册表主键）
    pit_role: none
  - name: trade_date
    type: date
    nullable: false
    description: 交易日
    pit_role: event_time
  - name: open
    type: float64
    unit: 元
    nullable: true
    description: 开盘价（不复权）
    pit_role: none
  - name: high
    type: float64
    unit: 元
    nullable: true
    description: 最高价（不复权）
    pit_role: none
  - name: low
    type: float64
    unit: 元
    nullable: true
    description: 最低价（不复权）
    pit_role: none
  - name: close
    type: float64
    unit: 元
    nullable: true
    description: 收盘价（不复权）
    pit_role: none
  - name: volume
    type: float64
    unit: 股
    nullable: true
    description: 成交量
    pit_role: none
  - name: amount
    type: decimal
    precision: 24
    scale: 4
    unit: 元
    nullable: true
    description: 成交额（精确金额）
    pit_role: none
  - name: knowledge_time
    type: timestamp_tz
    nullable: false
    description: 该版本进入平台的时间
    pit_role: knowledge_time
  - name: publish_time
    type: timestamp_tz
    nullable: true
    description: 行情发布/可得时间（若源提供）
    pit_role: publish_time
  - name: ingest_time
    type: timestamp_tz
    nullable: false
    description: 物理入库时间（审计）
    pit_role: ingest_time
  - name: version
    type: int64
    nullable: false
    description: 同业务键版本号（append-only）
    pit_role: none
  - name: provider
    type: enum
    enum: [tushare, baostock, wind, akshare, fuyao]
    nullable: false
    description: 该行来源（provider 维度）
    pit_role: none
