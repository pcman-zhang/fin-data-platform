dataset: cn_equity.listing_lifecycle
semantic_version: 1
domain: cn_equity
description: 交易状态（上市/暂停/退市）；PIT Universe 权威来源，替代注册表交易状态（首版知识时间取区间起点稳定值、重跑幂等；修订追加版本）
# 落地构造规则：源端一行 [list_date, delist_date] + list_status 不足以表达区间内状态，
# 必须拆为「listed: [list_date, delist_date-1]」与「delisted: [delist_date, null]」两行
# （未退市则仅 listed 一行）；否则 delisted 行覆盖全区间会使历史 as-of 误排除在市标的。
pit_class: scd2
business_key: [entity_id, start_date]
physical_key: [entity_id, start_date, knowledge_time, version]
grain: 标的 × 交易状态生效区间
update_sla:
  frequency: daily
  earliest_available: "T+0 20:00"
  latest_available: "T+1 22:00"
  tolerance: "1d"
sources:
  - provider: tushare
    endpoint: stock_basic
coverage:
  universe: A 股（含退市与暂停上市）
  universe_source: ref.entity
  history_start: "1990-12-19"
  expected_dates:
    calendar: ref.trade_calendar
    frequency: daily
storage:
  canonical_table: cn_equity.listing_lifecycle
  read_model: mart.listing_lifecycle_v1
  read_model_impl: view
  partition_strategy: none
  partition_interval: none
  retention: all
quality:
  - rule: unique
    keys: [entity_id, start_date, knowledge_time, version]
    severity: error
  - rule: not_null
    fields: [entity_id, status, start_date, knowledge_time, version]
    severity: error
  - rule: expression
    expr: "end_date >= start_date"
    severity: error
  - rule: reconcile
    against: ref.entity
    severity: warn
lineage:
  upstream: []
  transform: raw
mappings:
  - provider: tushare
    endpoint: stock_basic
    fields:
      status: list_status
      start_date: list_date
      end_date: delist_date
fields:
  - name: entity_id
    type: int64
    nullable: false
    description: 标的 ID
    pit_role: none
  - name: status
    type: enum
    enum: [listed, suspended, delisted]
    nullable: false
    description: 交易状态（listed 上市/suspended 暂停上市/delisted 退市）
    pit_role: none
  - name: start_date
    type: date
    nullable: false
    description: 状态生效起始日（含当日）
    pit_role: event_time
  - name: end_date
    type: date
    nullable: true
    description: 状态生效结束日（含当日；NULL=至今）
    pit_role: none
  - name: reason
    type: string
    nullable: true
    description: 状态变更原因
    pit_role: none
  - name: knowledge_time
    type: timestamp_tz
    nullable: false
    description: 该版本进入平台的时间（首版 = 区间起点当日 15:00 CST 稳定值；修订 = 同步时刻）
    pit_role: knowledge_time
  - name: version
    type: int64
    nullable: false
    description: 同业务键版本号
    pit_role: none
  - name: provider
    type: enum
    enum: [tushare]
    nullable: false
    description: 数据来源
    pit_role: none
