[params.adjust]
none = ""
qfq = "qfq"
hfq = "hfq"

[params.date]
format = "%Y%m%d"

[response.bars]
required = ["日期", "开盘", "最高", "最低", "收盘", "成交量", "成交额"]

[response.bars.fields]
date = { source = "日期", type = "date" }
open = { source = "开盘", type = "float" }
high = { source = "最高", type = "float" }
low = { source = "最低", type = "float" }
close = { source = "收盘", type = "float" }
volume = { source = "成交量", type = "float", factor = 100.0 }
amount = { source = "成交额", type = "float" }

[response.fund_nav]
required = ["净值日期", "单位净值"]

[response.fund_nav.fields]
date = { source = "净值日期", type = "date" }
unit_nav = { source = "单位净值", type = "float" }
accum_nav = { source = "累计净值", type = "float", optional = true }
daily_return = { source = "日增长率", type = "float", optional = true }

[response.trade_calendar]
required = ["trade_date"]

[response.trade_calendar.fields]
date = { source = "trade_date", type = "date" }

# 快照（全市场 spot 接口；基金 spot 的 开盘价/最高价/最低价 在适配器内统一为 今开/最高/最低）
[response.snapshot]
required = ["代码", "最新价", "成交量", "成交额"]

[response.snapshot.fields]
last = { source = "最新价", type = "float" }
open = { source = "今开", type = "float" }
high = { source = "最高", type = "float" }
low = { source = "最低", type = "float" }
prev_close = { source = "昨收", type = "float" }
volume = { source = "成交量", type = "float", factor = 100.0 }
amount = { source = "成交额", type = "float" }
