[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fin-data-platform"
description = "金融数据平台：多源接入（Tushare / Wind / 同花顺 iFinD / AkShare 等）+ PIT 持久化 + 统一服务"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dynamic = ["version"]
dependencies = [
    "pandas>=3.0,<4",
]

[project.optional-dependencies]
tushare = ["tushare>=1.4"]
akshare = ["akshare>=1.17"]
ifind = ["httpx>=0.27"]
wind = ["httpx>=0.27"]
fuyao = ["httpx>=0.27"]
baostock = ["baostock>=0.8"]
platform = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "apscheduler>=3.10,<4",
]
cache = [
    "redis>=5.0",
    "pyarrow>=17",
]
derive = [
    "duckdb>=1.2",
    "pyarrow>=17",
]
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
dev = [
    "pytest>=8.0",
    "duckdb>=1.2",
    "ruff>=0.6",
    "mypy>=1.10",
    "fakeredis>=2.26",
    "redis>=5.0",
    "pyarrow>=17",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pandas-stubs>=2.2",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "apscheduler>=3.10,<4",
]

[tool.setuptools.dynamic]
version = { attr = "fin_data_hub._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fin_data_hub = ["py.typed", "specs/*.toml"]
fin_data_platform = [
    "py.typed",
    "dictionary/_schema/*.json",
    "dictionary/*/*.yaml",
    "dictionary/*/*/*.yaml",
    "registry/*.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not integration'"
markers = [
    "integration: 需要真实凭证与外网的集成测试（默认跳过；用 pytest -m integration 运行）",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# 生成的迁移文件：DDL 语句为单行字面量（含 Timescale 参数），不折行
"migrations/versions/*.py" = ["E501"]

[tool.mypy]
packages = ["fin_data_hub", "fin_data_platform"]

[[tool.mypy.overrides]]
module = [
    "tushare.*",
    "akshare.*",
    "baostock.*",
    "yaml.*",
    "apscheduler.*",
    "duckdb.*",
    "pyarrow.*",
]
ignore_missing_imports = true
